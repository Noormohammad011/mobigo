# Local development database. Production uses Supabase (see .env.example).
services:
  db:
    image: postgres:17-alpine
    container_name: mobigo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mobigo
      POSTGRES_PASSWORD: mobigo
      POSTGRES_DB: mobigo
    ports:
      - "5432:5432"
    volumes:
      - mobigo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobigo -d mobigo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mobigo-db-data:
